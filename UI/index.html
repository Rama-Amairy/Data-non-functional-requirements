<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>منصة الاختبارات الإلكترونية</title>
<style>
  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --primary: #0f766e;
    --primary-soft: #ccfbf1;
    --primary-dark: #115e59;
    --accent: #1d4ed8;
    --ok: #15803d;
    --warn: #b45309;
    --err: #b91c1c;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .05);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif;
    line-height: 1.7;
  }

  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- Login screen ---------- */
  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 36px;
    width: 100%;
    max-width: 440px;
    text-align: center;
  }
  .login-card h1 { font-size: 22px; margin: 0 0 6px; }
  .login-card p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .badge-course {
    display: inline-block;
    background: var(--primary-soft);
    color: var(--primary-dark);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 12px;
    margin-bottom: 18px;
  }
  label.field { display: block; text-align: right; font-size: 14px; margin-bottom: 8px; color: var(--muted); }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    background: #fbfdff;
    color: var(--text);
  }
  input[type="text"]:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }

  .btn {
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 15px;
    background: var(--primary);
    color: #fff;
    transition: background .15s ease, opacity .15s ease;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-block { width: 100%; margin-top: 20px; }
  .btn-ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: #f1f5f9; }
  .btn-danger { background: #be123c; }
  .btn-danger:hover { background: #9f1239; }

  .form-error { color: var(--err); font-size: 13px; margin-top: 14px; min-height: 18px; }

  /* ---------- Page header ---------- */
  header.topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar .title { font-weight: 700; font-size: 16px; }
  .topbar .who { color: var(--muted); font-size: 13px; }
  .topbar .spacer { flex: 1; }

  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    font-weight: 700;
    background: var(--primary-soft);
    color: var(--primary-dark);
    padding: 6px 16px;
    border-radius: 999px;
    letter-spacing: .5px;
  }
  .timer.warn { background: #fef3c7; color: var(--warn); }
  .timer.danger { background: #fee2e2; color: var(--err); }

  .save-status {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #f1f5f9;
    color: var(--muted);
    white-space: nowrap;
  }
  .save-status.saving { background: #eff6ff; color: var(--accent); }
  .save-status.saved  { background: #dcfce7; color: var(--ok); }
  .save-status.error  { background: #fee2e2; color: var(--err); }

  /* ---------- Exam layout ---------- */
  .layout {
    max-width: 1080px;
    margin: 24px auto;
    padding: 0 24px 48px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 24px;
    align-items: start;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
  }
  .sidebar h3 { margin: 0 0 14px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .nav-btn {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    background: #f8fafc;
    color: var(--muted);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    display: grid;
    place-items: center;
  }
  .nav-btn:hover { border-color: var(--primary); }
  .nav-btn.answered { background: var(--primary-soft); color: var(--primary-dark); border-color: #99f6e4; }
  .nav-btn.current { outline: 2px solid var(--primary); outline-offset: 1px; }

  .legend { margin-top: 16px; font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; }
  .legend span { display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 4px; border: 1px solid var(--border); display: inline-block; }
  .dot.answered { background: var(--primary-soft); border-color: #99f6e4; }
  .dot.empty { background: #f8fafc; }

  .progress-line { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .bar { height: 6px; background: #eef2f7; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--primary); width: 0; transition: width .25s ease; }

  .q-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .q-counter { font-size: 13px; color: var(--muted); }
  .q-text { font-size: 19px; font-weight: 600; margin: 0 0 22px; }

  .options { display: grid; gap: 10px; }
  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    background: #fcfdfe;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: var(--primary); background: #f8fffe; }
  .option input { accent-color: var(--primary); width: 17px; height: 17px; cursor: pointer; }
  .option .key {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: #eef2f7;
    color: var(--muted);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
  }
  .option.selected { border-color: var(--primary); background: #f0fdfa; }
  .option.selected .key { background: var(--primary); color: #fff; }

  .q-actions {
    display: flex;
    gap: 10px;
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .q-actions .spacer { flex: 1; }

  /* ---------- Result ---------- */
  .result-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .result-card { max-width: 460px; width: 100%; text-align: center; }
  .score-ring {
    width: 150px; height: 150px;
    margin: 8px auto 18px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(var(--primary) var(--pct, 0%), #eef2f7 0);
  }
  .score-ring > div {
    width: 118px; height: 118px;
    background: var(--surface);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 30px; font-weight: 700;
    color: var(--primary-dark);
  }
  .result-lines { color: var(--muted); font-size: 14.5px; display: grid; gap: 4px; margin-bottom: 24px; }
  .result-lines b { color: var(--text); }

  .toast {
    position: fixed;
    bottom: 22px;
    inset-inline-start: 22px;
    background: #0f172a;
    color: #fff;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
    z-index: 50;
  }
  .toast.show { opacity: .95; transform: translateY(0); }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { order: 2; }
  }
</style>
</head>
<body>

<!-- ============ 1) Login screen ============ -->
<section id="screen-login" class="login-wrap">
  <div class="login-card">
    <div class="badge-course">تطبيقات شبكية موزّعة — القابلية للاسترداد</div>
    <h1>منصة الاختبارات الإلكترونية</h1>
    <p class="sub">أدخل اسمك للبدء. تُحفظ إجاباتك تلقائياً كل 30 ثانية.</p>

    <label class="field" for="student-name">اسم الطالب</label>
    <input type="text" id="student-name" placeholder="اكتب اسمك الكامل" autocomplete="off" />

    <button class="btn btn-block" id="btn-start">ابدأ الاختبار</button>
    <div class="form-error" id="login-error"></div>
  </div>
</section>

<!-- ============ 2) Exam screen ============ -->
<section id="screen-exam" class="hidden">
  <header class="topbar">
    <span class="title" id="exam-title">الاختبار</span>
    <span class="who" id="exam-student"></span>
    <span class="spacer"></span>
    <span class="save-status" id="save-status">— لم يبدأ الحفظ بعد</span>
    <span class="timer" id="timer">--:--</span>
  </header>

  <div class="layout">
    <aside class="panel sidebar">
      <h3>الأسئلة</h3>
      <div class="nav-grid" id="nav-grid"></div>
      <div class="legend">
        <span><i class="dot answered"></i> سؤال مُجاب</span>
        <span><i class="dot empty"></i> سؤال بلا إجابة</span>
      </div>
      <div class="progress-line">
        <span id="progress-text">0 من 0</span>
        <div class="bar"><i id="progress-bar"></i></div>
      </div>
      <button class="btn btn-ghost btn-block" id="btn-save-now">حفظ الآن</button>
    </aside>

    <main class="panel">
      <div class="q-head">
        <span class="q-counter" id="q-counter"></span>
      </div>
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options"></div>

      <div class="q-actions">
        <button class="btn btn-ghost" id="btn-prev">→ السابق</button>
        <button class="btn btn-ghost" id="btn-next">التالي ←</button>
        <span class="spacer"></span>
        <button class="btn btn-danger" id="btn-submit">تسليم الاختبار</button>
      </div>
    </main>
  </div>
</section>

<!-- ============ 3) Result screen ============ -->
<section id="screen-result" class="hidden result-wrap">
  <div class="panel result-card">
    <h1 style="font-size:20px;margin:0 0 4px;">تم تسليم الاختبار</h1>
    <p class="sub" style="color:var(--muted);margin:0 0 18px;font-size:14px;" id="result-student"></p>

    <div class="score-ring" id="score-ring"><div id="score-value">0%</div></div>

    <div class="result-lines">
      <span>الإجابات الصحيحة: <b id="res-correct">0</b> من <b id="res-total">0</b></span>
      <span>عدد الأسئلة المُجابة: <b id="res-answered">0</b></span>
      <span>وقت التسليم: <b id="res-time">—</b></span>
    </div>

    <button class="btn btn-ghost btn-block" id="btn-restart">العودة إلى البداية</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   منصة الاختبارات — المرحلة الأولى
   الحفظ التلقائي (Auto-Save) + ذاكرة محليّة + استعادة الإجابات بعد الانقطاع
   ========================================================================= */

const API_BASE      = '/api/v1';
const EXAM_ID       = 1;
const ATTEMPT_ID    = 1;
const AUTOSAVE_MS   = 30000;   // autosave every 30 seconds
const LS_KEY        = `exam_platform_attempt_${ATTEMPT_ID}`;

/* In-memory application state */
const state = {
  exam: null,
  index: 0,
  /* question_id -> { value: 'a'|'b'|'c'|'d', version: number, synced: boolean } */
  answers: {},
  studentName: '',
  deadline: null,      // timestamp (ms) of the exam deadline
  timerId: null,
  autosaveId: null,
  saving: false,
  submitted: false,
};

/* ---------------------- Helpers ---------------------- */

const $ = (id) => document.getElementById(id);

function showScreen(name) {
  ['login', 'exam', 'result'].forEach((s) => {
    $(`screen-${s}`).classList.toggle('hidden', s !== name);
  });
}

let toastTimer = null;
function toast(message) {
  const el = $('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

/* ---------------------- Local cache ----------------------
   An immediate backup in the browser: if the network drops or the browser is
   closed suddenly, the answers stay stored locally and are sent to the server
   on the first successful connection.                                        */

function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      answers: state.answers,
      studentName: state.studentName,
      deadline: state.deadline,
      savedAt: Date.now(),
    }));
  } catch (_) { /* the browser may block storage — we do not fail the exam over that */ }
}

function loadLocal() {
  try {
    return JSON.parse(localStorage.getItem(LS_KEY) || 'null');
  } catch (_) { return null; }
}

function clearLocal() {
  try { localStorage.removeItem(LS_KEY); } catch (_) {}
}

/* ---------------------- Save status indicator ---------------------- */

function setSaveStatus(kind, text) {
  const el = $('save-status');
  el.className = `save-status ${kind}`;
  el.textContent = text;
}

function pendingAnswers() {
  return Object.entries(state.answers)
    .filter(([, a]) => !a.synced && a.value)
    .map(([qid, a]) => ({
      question_id: Number(qid),
      selected_answer: a.value,
      version: a.version,
    }));
}

/* ---------------------- Autosave ---------------------- */

async function syncAnswers({ silent = false } = {}) {
  if (state.saving || state.submitted) return true;

  const payload = pendingAnswers();
  if (payload.length === 0) {
    if (!silent) setSaveStatus('saved', '✓ كل الإجابات محفوظة');
    return true;
  }

  state.saving = true;
  setSaveStatus('saving', '⏳ جاري الحفظ...');

  /* Capture the version sent for each question so an answer edited mid-request is not marked as saved */
  const sentVersions = Object.fromEntries(payload.map((a) => [a.question_id, a.version]));

  try {
    const res = await api(`${API_BASE}/attempts/${ATTEMPT_ID}/save`, {
      method: 'POST',
      body: JSON.stringify({ attempt_id: ATTEMPT_ID, answers: payload }),
    });

    for (const [qid, version] of Object.entries(sentVersions)) {
      const local = state.answers[qid];
      if (local && local.version === version) local.synced = true;
    }
    saveLocal();

    const time = new Date(res.server_time).toLocaleTimeString('ar-SY', {
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
    setSaveStatus('saved', `✓ تم الحفظ (${res.saved_count}) — ${time}`);
    return true;
  } catch (err) {
    setSaveStatus('error', `⚠ فشل الحفظ — ${payload.length} إجابة بانتظار الإرسال`);
    console.warn('فشل الحفظ التلقائي:', err.message);
    return false;
  } finally {
    state.saving = false;
  }
}

function startAutoSave() {
  clearInterval(state.autosaveId);
  state.autosaveId = setInterval(() => syncAnswers({ silent: true }), AUTOSAVE_MS);
}

/* One last send attempt when the tab is closed or the page is refreshed */
function flushOnExit() {
  const payload = pendingAnswers();
  if (payload.length === 0 || state.submitted) return;
  const body = new Blob(
    [JSON.stringify({ attempt_id: ATTEMPT_ID, answers: payload })],
    { type: 'application/json' }
  );
  navigator.sendBeacon(`${API_BASE}/attempts/${ATTEMPT_ID}/save`, body);
}

/* ---------------------- Loading the exam and restoring answers ---------------------- */

async function startExam() {
  const name = $('student-name').value.trim();
  if (!name) {
    $('login-error').textContent = 'الرجاء إدخال اسم الطالب.';
    return;
  }

  const btn = $('btn-start');
  btn.disabled = true;
  btn.textContent = 'جاري التحضير...';
  $('login-error').textContent = '';

  try {
    /* One call: seeds the demo data if needed, stores the name, returns the ids */
    const session = await api(`${API_BASE}/students/demo-login`, {
      method: 'POST',
      body: JSON.stringify({ name }),
    });
    state.exam = await api(`${API_BASE}/exams/${session.exam_id}`);
    state.studentName = session.student_name;

    const cached = loadLocal();
    state.answers = (cached && cached.answers) || {};

    /* Restore the answers from the server and merge them with the local copy */
    let serverState = null;
    try {
      serverState = await api(`${API_BASE}/attempts/${ATTEMPT_ID}/answers`);
      mergeServerAnswers(serverState.answers);
    } catch (err) {
      toast('تعذّر جلب الإجابات من الخادم — تم استخدام النسخة المحليّة.');
    }

    /* If the attempt was already submitted, show the result straight away */
    if (serverState && serverState.is_submitted) {
      const result = await api(`${API_BASE}/attempts/${ATTEMPT_ID}/result`);
      clearLocal();
      showResult(result);
      return;
    }

    /* Timer: fix the deadline once and store it, so refreshing no longer grants extra time */
    state.deadline = (cached && cached.deadline)
      || Date.now() + state.exam.duration_minutes * 60000;

    saveLocal();
    renderExam();
    showScreen('exam');
    startTimer();
    startAutoSave();

    const restored = Object.keys(state.answers).length;
    if (restored > 0) toast(`تمت استعادة ${restored} إجابة محفوظة.`);

    /* If local answers never reached the server, send them immediately */
    if (pendingAnswers().length > 0) syncAnswers();
    else setSaveStatus('saved', '✓ كل الإجابات محفوظة');
  } catch (err) {
    $('login-error').textContent = `تعذّر بدء الاختبار: ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'ابدأ الاختبار';
  }
}

/* Merge server answers with the local ones: the newer version wins (higher version number) */
function mergeServerAnswers(serverAnswers) {
  for (const remote of serverAnswers) {
    if (!remote.selected_answer) continue;
    const local = state.answers[remote.question_id];
    if (!local || remote.version > local.version) {
      state.answers[remote.question_id] = {
        value: remote.selected_answer,
        version: remote.version,
        synced: true,
      };
    } else if (local.version === remote.version && local.value === remote.selected_answer) {
      local.synced = true;   // identical: no need to resend
    }
  }
}

/* ---------------------- Countdown timer ---------------------- */

function startTimer() {
  clearInterval(state.timerId);
  tickTimer();
  state.timerId = setInterval(tickTimer, 1000);
}

function tickTimer() {
  const remaining = Math.max(0, state.deadline - Date.now());
  const totalSeconds = Math.floor(remaining / 1000);
  const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
  const seconds = String(totalSeconds % 60).padStart(2, '0');

  const el = $('timer');
  el.textContent = `${minutes}:${seconds}`;
  el.className = 'timer' + (totalSeconds <= 60 ? ' danger' : totalSeconds <= 300 ? ' warn' : '');

  if (remaining === 0) {
    clearInterval(state.timerId);
    toast('انتهى الوقت — يجري التسليم التلقائي.');
    submitExam({ auto: true });
  }
}

/* ---------------------- Rendering the questions ---------------------- */

function renderExam() {
  $('exam-title').textContent = state.exam.title;
  $('exam-student').textContent = `— ${state.studentName}`;
  renderNav();
  renderQuestion();
}

function renderNav() {
  const grid = $('nav-grid');
  grid.innerHTML = '';
  state.exam.questions.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.textContent = i + 1;
    if (state.answers[q.id] && state.answers[q.id].value) btn.classList.add('answered');
    if (i === state.index) btn.classList.add('current');
    btn.addEventListener('click', () => { state.index = i; renderQuestion(); renderNav(); });
    grid.appendChild(btn);
  });

  const total = state.exam.questions.length;
  const answered = state.exam.questions.filter((q) => state.answers[q.id]?.value).length;
  $('progress-text').textContent = `أجبت عن ${answered} من ${total}`;
  $('progress-bar').style.width = `${total ? (answered / total) * 100 : 0}%`;
}

function renderQuestion() {
  const questions = state.exam.questions;
  const q = questions[state.index];

  $('q-counter').textContent = `السؤال ${state.index + 1} من ${questions.length}`;
  $('q-text').textContent = q.text;

  const box = $('options');
  box.innerHTML = '';
  const current = state.answers[q.id]?.value;

  for (const key of ['a', 'b', 'c', 'd']) {
    const label = document.createElement('label');
    label.className = 'option' + (current === key ? ' selected' : '');

    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q_${q.id}`;
    radio.value = key;
    radio.checked = current === key;
    radio.addEventListener('change', () => selectAnswer(q.id, key));

    const badge = document.createElement('span');
    badge.className = 'key';
    badge.textContent = { a: 'أ', b: 'ب', c: 'ج', d: 'د' }[key];

    const text = document.createElement('span');
    text.textContent = q.options[key];

    label.append(radio, badge, text);
    box.appendChild(label);
  }

  $('btn-prev').disabled = state.index === 0;
  $('btn-next').disabled = state.index === questions.length - 1;
}

/* Selecting an answer: bump the version number and mark it unsaved until it reaches the server */
function selectAnswer(questionId, value) {
  const previous = state.answers[questionId];
  state.answers[questionId] = {
    value,
    version: (previous?.version || 0) + 1,
    synced: false,
  };
  saveLocal();
  setSaveStatus('', `● ${pendingAnswers().length} إجابة بانتظار الحفظ`);
  renderQuestion();
  renderNav();
}

/* ---------------------- Submission and result ---------------------- */

async function submitExam({ auto = false } = {}) {
  if (state.submitted) return;

  const total = state.exam.questions.length;
  const answered = state.exam.questions.filter((q) => state.answers[q.id]?.value).length;

  if (!auto) {
    const message = answered < total
      ? `لم تُجب عن ${total - answered} سؤال. هل تريد التسليم على أي حال؟`
      : 'هل تريد تسليم الاختبار؟';
    if (!confirm(message)) return;
  }

  const btn = $('btn-submit');
  btn.disabled = true;
  btn.textContent = 'جاري التسليم...';

  /* Do not submit before making sure the latest answers reached the server */
  const flushed = await syncAnswers();
  if (!flushed && !confirm('تعذّر حفظ بعض الإجابات. المتابعة قد تُفقدها — هل تريد التسليم؟')) {
    btn.disabled = false;
    btn.textContent = 'تسليم الاختبار';
    return;
  }

  try {
    const result = await api(`${API_BASE}/attempts/${ATTEMPT_ID}/submit`, { method: 'POST' });
    state.submitted = true;
    clearInterval(state.timerId);
    clearInterval(state.autosaveId);
    clearLocal();
    showResult(result);
  } catch (err) {
    toast(`تعذّر التسليم: ${err.message}`);
    btn.disabled = false;
    btn.textContent = 'تسليم الاختبار';
  }
}

function showResult(result) {
  state.submitted = true;
  $('result-student').textContent = state.studentName ? `الطالب: ${state.studentName}` : '';
  $('res-correct').textContent = result.correct_count;
  $('res-total').textContent = result.total_questions;
  $('res-answered').textContent = result.answered_count;
  $('res-time').textContent = result.finished_at
    ? new Date(result.finished_at).toLocaleString('ar-SY')
    : '—';

  $('score-value').textContent = `${result.percentage}%`;
  $('score-ring').style.setProperty('--pct', `${result.percentage}%`);

  showScreen('result');
}

/* ---------------------- Event wiring ---------------------- */

$('btn-start').addEventListener('click', startExam);
$('student-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') startExam(); });

$('btn-prev').addEventListener('click', () => {
  if (state.index > 0) { state.index--; renderQuestion(); renderNav(); }
});
$('btn-next').addEventListener('click', () => {
  if (state.index < state.exam.questions.length - 1) { state.index++; renderQuestion(); renderNav(); }
});

$('btn-save-now').addEventListener('click', () => syncAnswers());
$('btn-submit').addEventListener('click', () => submitExam());
$('btn-restart').addEventListener('click', () => location.reload());

/* Network signals: resume saving as soon as the connection is back */
window.addEventListener('online', () => {
  toast('عاد الاتصال — تجري إعادة المزامنة.');
  syncAnswers();
});
window.addEventListener('offline', () => {
  setSaveStatus('error', '⚠ لا يوجد اتصال — الإجابات محفوظة محليّاً');
});

/* Save when the page is hidden or closed */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushOnExit();
});
window.addEventListener('pagehide', flushOnExit);

/* Restore the student name if one exists from a previous session */
const cachedStart = loadLocal();
if (cachedStart && cachedStart.studentName) {
  $('student-name').value = cachedStart.studentName;
}
</script>
</body>
