# Basic connection settings
listen_addresses = '*'
port = 5432

# WAL and Streaming Replication settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
hot_standby = on

# Zero Data Loss configuration
# synchronous_commit=on is the Postgres default and is a no-op until
# synchronous_standby_names names a standby. Do NOT set
# synchronous_standby_names here: on a brand-new cluster this container's own
# bootstrap (creating the repmgr role, app_db, etc.) runs before any standby
# exists, and every one of those commits would then block forever waiting for
# an acknowledgement no standby can yet send - a deadlock. Enable it only
# after the standby has joined, via scripts/enable-sync-replication.sh.
synchronous_commit = on

# Store passwords hashed with SCRAM instead of MD5, matching the
# scram-sha-256 auth method requested via POSTGRESQL_PGHBA_AUTH_METHOD
password_encryption = scram-sha-256
