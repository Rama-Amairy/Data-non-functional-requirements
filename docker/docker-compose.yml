services:
  etcd:
    image: bitnamilegacy/etcd:3.5.9-debian-11-r99
    environment:
      # Allow etcd to run without auth for local development/testing
      - ALLOW_NONE_AUTHENTICATION=yes # Dervops/ Close Networks
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    networks:
      - pg_network

  pg_node_1:
    image: bitnamilegacy/postgresql-repmgr:16.6.0-debian-12-r3
    environment:
      # Database credentials — from docker/.env (git-ignored), see
      # docker/.env.example. The ":?err" form fails the deploy loudly
      # instead of silently starting with an empty/weak password if the
      # file is missing.
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in docker/.env}
      - POSTGRESQL_USERNAME=${APP_DB_USER:?Set APP_DB_USER in docker/.env}
      - POSTGRESQL_PASSWORD=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}
      - POSTGRESQL_DATABASE=${APP_DB_NAME:?Set APP_DB_NAME in docker/.env}
      # Replication and HA settings
      - REPMGR_PASSWORD=${REPMGR_PASSWORD:?Set REPMGR_PASSWORD in docker/.env}
      - REPMGR_PARTNER_NODES=pg_node_1,pg_node_2
      - REPMGR_PRIMARY_HOST=pg_node_1
      - REPMGR_NODE_NETWORK_NAME=pg_node_1
      - REPMGR_NODE_NAME=node-1
      - REPMGR_NODE_ID=1
      # Use SCRAM instead of MD5 in the auto-generated pg_hba.conf
      - POSTGRESQL_PGHBA_AUTH_METHOD=scram-sha-256
    ports:
      - "5434:5432"
    volumes:
      - pg_data_1:/bitnami/postgresql
      # Extra settings layered on top of the auto-generated postgresql.conf
      # (included via its conf.d directory, so repmgr's own required settings
      # such as shared_preload_libraries are kept intact)
      - ./config/postgresql.conf:/bitnami/postgresql/conf/conf.d/custom.conf:ro
    networks:
      - pg_network
    depends_on:
      - etcd

  pg_node_2:
    image: bitnamilegacy/postgresql-repmgr:16.6.0-debian-12-r3
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in docker/.env}
      - POSTGRESQL_USERNAME=${APP_DB_USER:?Set APP_DB_USER in docker/.env}
      - POSTGRESQL_PASSWORD=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in docker/.env}
      - POSTGRESQL_DATABASE=${APP_DB_NAME:?Set APP_DB_NAME in docker/.env}
      - REPMGR_PASSWORD=${REPMGR_PASSWORD:?Set REPMGR_PASSWORD in docker/.env}
      - REPMGR_PARTNER_NODES=pg_node_1,pg_node_2
      - REPMGR_PRIMARY_HOST=pg_node_1
      - REPMGR_NODE_NETWORK_NAME=pg_node_2
      - REPMGR_NODE_NAME=node-2
      - REPMGR_NODE_ID=2
      # Use SCRAM instead of MD5 in the auto-generated pg_hba.conf
      - POSTGRESQL_PGHBA_AUTH_METHOD=scram-sha-256
    ports:
      # Exposed on 5433 to avoid port conflict on the host machine
      - "5433:5432"
    volumes:
      - pg_data_2:/bitnami/postgresql
      - ./config/postgresql.conf:/bitnami/postgresql/conf/conf.d/custom.conf:ro
    networks:
      - pg_network
    depends_on:
      - pg_node_1

networks:
  pg_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  pg_data_1:
  pg_data_2:
